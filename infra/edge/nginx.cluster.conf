# The cluster edge: the same CDN stand-in as nginx.conf, in front of the API
# containers (docker compose --profile cluster). Web pages still come from
# the dev server on the host.
#
# It only caches what the origin marks public: the menu for s-maxage (10 s),
# serving a stale copy while it fetches a fresh one, and uploaded photos for a
# year (their names are content hashes). Anything with a session cookie or
# marked private or no-store passes straight through. X-Cache shows HIT or MISS.

worker_processes auto;
events { worker_connections 4096; }

http {
  proxy_cache_path /var/cache/nginx/pass levels=1:2 keys_zone=pass:20m max_size=500m inactive=1d use_temp_path=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  upstream web { server host.docker.internal:3000; keepalive 32; }
  # Every copy of the api service: Docker's DNS answers with all of them,
  # and nginx spreads requests across the addresses it gets at start.
  upstream api {
    least_conn;
    server api:4000 max_fails=1 fail_timeout=5s;
    keepalive 128;
  }
  upstream gateway { server host.docker.internal:4100; }

  server {
    listen 80;
    client_max_body_size 4m;

    proxy_http_version 1.1;
    add_header X-Cache $upstream_cache_status always;
    # proxy_set_header is not inherited by a location that sets its own, so
    # every location below repeats these.

    # Public reads the origin allows a shared cache to keep.
    location ~ ^/api/v1/(locations/[^/]+/menu|media/) {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api;
      proxy_set_header Connection "";
      proxy_cache pass;
      proxy_cache_key $scheme$host$uri;
      proxy_cache_revalidate on;
      proxy_cache_lock on;
      proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      # Never store a response meant for one signed-in person.
      proxy_no_cache $http_cookie;
      proxy_cache_bypass $http_cookie;
    }

    location /api/ {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api;
      proxy_set_header Connection "";
    }

    location /ws {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://gateway;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
    }

    location / {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://web;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
